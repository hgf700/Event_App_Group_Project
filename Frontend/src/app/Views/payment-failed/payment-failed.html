<div class="payment-wrapper">
  <div class="payment-card failed">
    <div class="payment-icon-circle">
      <div class="cross">✕</div>
    </div>

    <h1 class="payment-title">Płatność anulowana</h1>

    <p class="payment-subtitle">
      Płatność nie została zakończona. Nie pobrano opłaty za bilet.
      Możesz wrócić do wydarzeń i spróbować ponownie.
    </p>

    <div class="payment-info-box">
      <div class="info-line">
        <span>💳</span>
        <span>Nie pobrano opłaty za bilet</span>
      </div>

      <div class="info-line">
        <span>🔄</span>
        <span>Możesz ponownie rozpocząć zakup</span>
      </div>
    </div>

    <div class="payment-actions">
      <button
        class="btn-primary-payment"
        (click)="returnToEvents()">
        🔄 Spróbuj ponownie
      </button>

      <button
        class="btn-secondary-payment"
        routerLink="/login-callback">
        Wróć do panelu
      </button>

    </div>
  </div>
</div>
