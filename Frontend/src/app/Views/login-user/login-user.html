<main class="main">
  <form [formGroup]="loginUserForm" (ngSubmit)="onSubmit()">
    <label>Email login</label>
    <input type="email" formControlName="email" />
    <input type="password" formControlName="password"/>

    <button type="submit">Login</button>
  </form>
</main>
