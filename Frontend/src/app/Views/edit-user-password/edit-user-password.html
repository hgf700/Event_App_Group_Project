<div class="auth-wrapper">
  <div class="auth-card">
    <button class="btn-back-inline" (click)="returnToLoginCallback()">← Wróć do panelu</button>

    <div class="auth-header">
      <div class="auth-icon">🔑</div>
      <h1>Zmień hasło</h1>
      <p>Wprowadź nowe hasło dwa razy dla potwierdzenia</p>
    </div>

    @if (submitted && editUserPasswordForm.errors?.['passwordMismatch']) {
    <div class="form-alert">
      ⚠️ Hasła nie są takie same
    </div>
    }

    <form [formGroup]="editUserPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="newPassword">Nowe hasło</label>
        <input id="newPassword"
               type="password"
               formControlName="newPassword"
               placeholder="••••••••"
               autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="repeatNewPassword">Powtórz nowe hasło</label>
        <input id="repeatNewPassword"
               type="password"
               formControlName="repeatNewPassword"
               placeholder="••••••••"
               autocomplete="new-password" />
      </div>

      <button type="submit" class="btn-submit">
        Zmień hasło
      </button>
    </form>
  </div>
</div>
