<p>search-and-import-events works!</p>

<main class="main">
  <form [formGroup]="searchAndImportEventsForm" (ngSubmit)="onSubmit()">
    <label>city name</label>
    <input type="city" formControlName="city" placeholder="city" /> <br />

    <button type="submit">Search</button>
  </form>
</main>
