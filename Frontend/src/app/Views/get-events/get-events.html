<main>

<ul *ngIf="events.length > 0">
    <li *ngFor="let e of events">
        {{e.eventId}}
        {{e.address}}
        {{e.city}}
        {{e.country}}
        {{e.nameOfClub}}
        {{e.nameOfEvent}}
        {{e.photoUrl}}
        {{e.startOfEvent}}
        {{e.typeOfEvent}}
        {{e.urlOfEvent}}
        <!-- <button (click)="eventDetails(e.eventId)">eventDetails</button> -->

    </li>
</ul>
  <p *ngIf="events.length === 0">Brak events</p>

</main>
