<header>
  <nav class="navbar">
    <div class="left">
      <a routerLink="/" class="brand"> 🎫 EventApp </a>
      @if (isLogged()) {
        <a routerLink="/get-events">Wydarzenia</a>
        <a routerLink="/login-callback">Mój panel</a>
        <a routerLink="/search-and-import-events">Wyszukaj event</a>
      }
      @if (isAdmin()) {
        <a routerLink="/admin-panel" class="brand"> Admin Panel </a>
      }
    </div>

    <div class="right">
      @if (isLogged()) {
        <div class="dropdown">
          <button type="button">Witaj {{ authService.userEmail() }}</button>

          <div class="dropdown-content">
            <a routerLink="/edit-user">edytuj Konto</a>
            <a routerLink="/user-tickets">Moje eventy</a>
          </div>
        </div>

        <button type="button" class="btn-primary" (click)="logout()">Wyloguj</button>
      } @else {
        <ng-template #loadingEmail> Ładowanie... </ng-template>

        <a routerLink="/login-user" class="btn-register">Logowanie</a>
        <a routerLink="/register-user" class="btn-register">Rejestracja</a>
      }
    </div>
  </nav>
</header>

<main class="container">
  <router-outlet></router-outlet>
</main>

<footer class="footer">© 2026</footer>
